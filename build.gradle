plugins {
    id 'net.fabricmc.fabric-loom' version '1.15-SNAPSHOT'
    id 'maven-publish'
}

version = project.mod_version + "+" + project.minecraft_version
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

repositories {
    maven { url 'https://maven.tomalbrc.de' }
    maven { url = "https://maven.terraformersmc.com/" }
    maven { url = "https://maven.nucleoid.xyz" }
    maven { url = "https://maven.ladysnake.org/releases" }
    maven { url 'https://maven.parchmentmc.org' }
    maven { url 'https://maven.blamejared.com' }
    mavenLocal()
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    implementation "net.fabricmc:fabric-loader:${project.loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"

    // Polymer
    implementation ("eu.pb4:polymer-core:${project.polymer_version}")
    implementation ("eu.pb4:polymer-blocks:${project.polymer_version}")
    implementation ("eu.pb4:polymer-resource-pack:${project.polymer_version}")
    implementation ("eu.pb4:polymer-resource-pack-extras:${project.polymer_version}")
    implementation ("eu.pb4:polymer-sound-patcher:${project.polymer_version}")
    implementation ("eu.pb4:polymer-virtual-entity:${project.polymer_version}")
    implementation ("eu.pb4:polymer-networking:${project.polymer_version}")
    implementation ("eu.pb4:polymer-autohost:${project.polymer_version}")

    implementation include("eu.pb4:sgui:${project.sgui_version}")

    implementation include("de.tomalbrc:blockbench-import-library:${project.bil_version}")

    api("de.tomalbrc:filament:${project.filament_version}") {
        transitive = false
    }

    implementation("eu.pb4:trinkets:${trinkets_version}")

    implementation include('me.lucko:fabric-permissions-api:0.7.0')
    compileOnly 'net.luckperms:api:5.4'

    implementation ("de.tomalbrc:db-bundle:1.0.0")
}

processResources {
    inputs.property "version", project.version
    inputs.property "minecraft_version", project.minecraft_version
    inputs.property "loader_version", project.loader_version
    filteringCharset "UTF-8"

    filesMatching("fabric.mod.json") {
        expand "version": project.version,
                "minecraft_version": project.minecraft_version,
                "loader_version": project.loader_version
    }
}

def targetJavaVersion = 25
tasks.withType(JavaCompile).configureEach {
    it.options.encoding = "UTF-8"
    if (targetJavaVersion >= 10 || JavaVersion.current().isJava10Compatible()) {
        it.options.release.set(targetJavaVersion)
    }
}

java {
    def javaVersion = JavaVersion.toVersion(targetJavaVersion)
    if (JavaVersion.current() < javaVersion) {
        toolchain.languageVersion = JavaLanguageVersion.of(targetJavaVersion)
    }
    withSourcesJar()
}

jar {
    from("LICENSE") {
        rename { "${it}_${project.archives_base_name}" }
    }
}

